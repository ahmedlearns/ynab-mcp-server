# Runs the server for a remote connector (Claude Desktop, claude.ai, mobile).
# Copy .env.example to .env, fill it in, then run deploy/update.sh. That pulls
# the image CI publishes (.github/workflows/image.yml) and starts it here.
# To build from this checkout instead: docker compose up -d --wait --build
#
# Nothing is published on the host. The server joins the Docker network your
# Cloudflare Tunnel's cloudflared container runs on, and the tunnel's public
# hostname points at http://ynab-mcp:8000.
name: ynab-mcp

services:
  ynab-mcp:
    image: ghcr.io/ahmedlearns/ynab-mcp-server:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/data
    networks:
      - tunnel

networks:
  tunnel:
    name: ${TUNNEL_NETWORK:?set TUNNEL_NETWORK in .env}
    external: true

volumes:
  data:
